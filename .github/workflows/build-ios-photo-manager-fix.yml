name: Build Immich iOS fix

on:
  workflow_dispatch:
  push:
    branches:
      - fix/ios-photo-manager-3.10.0

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: fix/ios-photo-manager-3.10.0

      - name: Select Xcode 26.2
        run: |
          sudo xcode-select -s "/Applications/Xcode_26.2.app/Contents/Developer"
          xcodebuild -version

      - name: Install mise tools
        uses: jdx/mise-action@v4
        with:
          cache: true
          working_directory: ./mobile

      - name: Install mobile dependencies
        run: mise //mobile:install:ci

      - name: Run mobile code generation
        run: mise //mobile:codegen

      - name: Build iOS (no signing)
        working-directory: mobile
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        working-directory: mobile/build/ios/iphoneos
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qry Immich-iOS-photo-manager-3.10.0-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: immich-ios-photo-manager-3.10.0-unsigned
          path: mobile/build/ios/iphoneos/Immich-iOS-photo-manager-3.10.0-unsigned.ipa
          retention-days: 7
